{% extends 'dashboard/base_dashboard.html' %}

{% block title %}Site Settings{% endblock %}
{% block page_title %}Site Settings{% endblock %}
{% block nav_settings %}active{% endblock %}

{% block content %}
<div class="card-dark p-4">
  <form method="post">
    {% csrf_token %}
    <div class="row g-4">
      <div class="col-md-6">
        <label class="form-label text-light">Company Name</label>
        <input type="text" name="company_name" class="form-control form-control-dark" value="{{ site.company_name }}" />
      </div>
      <div class="col-md-6">
        <label class="form-label text-light">Tagline</label>
        <input type="text" name="tagline" class="form-control form-control-dark" value="{{ site.tagline }}" />
      </div>
      <div class="col-md-6">
        <label class="form-label text-light">Email</label>
        <input type="email" name="email" class="form-control form-control-dark" value="{{ site.email }}" />
      </div>
      <div class="col-md-6">
        <label class="form-label text-light">Phone</label>
        <input type="text" name="phone" class="form-control form-control-dark" value="{{ site.phone }}" />
      </div>
      <div class="col-md-6">
        <label class="form-label text-light">WhatsApp</label>
        <input type="text" name="whatsapp" class="form-control form-control-dark" value="{{ site.whatsapp }}" />
      </div>
      <div class="col-md-6">
        <label class="form-label text-light">Address</label>
        <input type="text" name="address" class="form-control form-control-dark" value="{{ site.address }}" />
      </div>
      <div class="col-md-6">
        <label class="form-label text-light">Facebook URL</label>
        <input type="url" name="facebook_url" class="form-control form-control-dark" value="{{ site.facebook_url }}" />
      </div>
      <div class="col-md-6">
        <label class="form-label text-light">Instagram URL</label>
        <input type="url" name="instagram_url" class="form-control form-control-dark" value="{{ site.instagram_url }}" />
      </div>
      <div class="col-md-6">
        <label class="form-label text-light">LinkedIn URL</label>
        <input type="url" name="linkedin_url" class="form-control form-control-dark" value="{{ site.linkedin_url }}" />
      </div>
      <div class="col-md-6">
        <label class="form-label text-light">Twitter URL</label>
        <input type="url" name="twitter_url" class="form-control form-control-dark" value="{{ site.twitter_url }}" />
      </div>
      <div class="col-12">
        <label class="form-label text-light">About Text</label>
        <textarea name="about_text" class="form-control form-control-dark" rows="4">{{ site.about_text }}</textarea>
      </div>
      <div class="col-12">
        <label class="form-label text-light">Mission Text</label>
        <textarea name="mission_text" class="form-control form-control-dark" rows="3">{{ site.mission_text }}</textarea>
      </div>
      <div class="col-12">
        <label class="form-label text-light">Vision Text</label>
        <textarea name="vision_text" class="form-control form-control-dark" rows="3">{{ site.vision_text }}</textarea>
      </div>
      <div class="col-12 text-end">
        <button type="submit" class="btn-glow">Save Settings</button>
      </div>
    </div>
  </form>
</div>
{% endblock %}

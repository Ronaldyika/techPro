<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login — TechPro Engineering</title>
  {% load static %}
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="{% static 'css/main.css' %}"/>
  <style>
    body { padding-top:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--dark); }
    .login-bg { position:fixed; inset:0; background-image:linear-gradient(rgba(230,126,34,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(230,126,34,0.03) 1px,transparent 1px); background-size:40px 40px; pointer-events:none; }
    .login-glow { position:fixed; width:600px; height:600px; background:radial-gradient(circle,rgba(230,126,34,0.08),transparent 65%); top:50%; left:50%; transform:translate(-50%,-50%); pointer-events:none; }
  </style>
</head>
<body>
<div class="login-bg"></div>
<div class="login-glow"></div>

<div style="width:100%;max-width:420px;padding:20px;position:relative;z-index:1;">
  <div class="text-center mb-5">
    <div class="d-flex align-items-center justify-content-center gap-2 mb-3">
      <div class="brand-icon" style="width:44px;height:44px;font-size:22px;"><i class="bi bi-lightning-fill"></i></div>
      <div class="text-start">
        <span class="brand-name" style="font-size:1.6rem;">TECHPRO</span>
        <span class="brand-sub d-block">ENGINEERING</span>
      </div>
    </div>
    <p class="text-muted small">Admin Dashboard Login</p>
  </div>

  {% if messages %}
  {% for msg in messages %}
  <div class="alert alert-danger mb-4" style="border-radius:var(--radius);">{{ msg }}</div>
  {% endfor %}
  {% endif %}

  <div class="card-dark p-4">
    <h4 style="font-family:var(--font-display);color:#fff;letter-spacing:0.06em;margin-bottom:24px;text-align:center;">Sign In</h4>
    <form method="post" action="{% url 'dashboard_login' %}">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label-custom">Username</label>
        <input type="text" name="username" class="form-control-dark" required placeholder="Enter your username" autofocus/>
      </div>
      <div class="mb-4">
        <label class="form-label-custom">Password</label>
        <div class="position-relative">
          <input type="password" name="password" class="form-control-dark" id="pwd" required placeholder="Enter your password" style="padding-right:44px;"/>
          <button type="button" onclick="const i=document.getElementById('pwd');i.type=i.type==='password'?'text':'password';" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer;"><i class="bi bi-eye"></i></button>
        </div>
      </div>
      <button type="submit" class="btn-glow w-100" style="border:none;cursor:pointer;font-size:1rem;">
        <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
      </button>
    </form>
  </div>

  <p class="text-center mt-4 text-muted small">
    <a href="{% url 'home' %}" style="color:var(--text-muted);text-decoration:none;"><i class="bi bi-arrow-left me-1"></i>Back to Website</a>
  </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
